        <div class="nav-group">
          <button class="nav-gbtn" type="button" aria-expanded="false" aria-haspopup="true" data-i18n="nav_markets">Bozorlar</button>
          <div class="nav-menu">
            <a href="bozor.html" data-i18n="nav_bozor">Bozor</a>

        </div>
        <a href="showroom.html" data-i18n="nav_showroom">Showroom</a>
        <div class="nav-group">
          <button class="nav-gbtn" type="button" aria-expanded="false" aria-haspopup="true" data-i18n="nav_services">Xizmatlar</button>
          <div class="nav-menu">
            <a href="xizmatlar.html" data-i18n="nav_svc_members">A'zo korxonalar</a>

        </div>
        <a href="associations.html" data-i18n="nav_uyush">Uyushmalar</a>
        <a href="about.html" data-i18n="nav_about">Biz haqimizda</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" type="button" title="Tema" aria-label="Tema"></button>
        <button class="lang-btn" id="langBtn" type="button" title="Til">UZ</button>
        <a class="btn btn-ghost" href="index.html" data-i18n="d_home">Bosh sahifa</a>
      </div>
      <button class="burger" id="burger" aria-label="Menyu"><span></span><span></span><span></span></button>
    </div>

  <!-- LOGIN OVERLAY -->
  <div class="asst-login" id="confLogin" hidden>
    <form class="lcard" id="emailForm">
      <span class="ai-avatar">@</span>
      <h2 id="lgTitle">Konferensiyaga kirish</h2>
      <p id="lgSub">Email kiriting — konferensiyaga qo'shilish uchun.</p>
      <div class="err" id="emailErr"></div>
      <input type="email" id="emailInput" placeholder="email@example.com" autocomplete="email" />
      <button class="btn btn-primary btn-lg" type="submit" style="width:100%" id="lgBtn">Davom etish →</button>
    </form>
  </div>

  <!-- MAIN -->
  <main class="conf-page" id="confApp" hidden>
    <div class="container">
      <div class="conf-userbar">
        <span><span class="ai-avatar" style="width:30px;height:30px;font-size:13px;display:inline-grid;place-items:center;vertical-align:middle">@</span> <b id="uEmail">—</b></span>
        <button class="asst-logout-link" id="switchEmail" type="button">Boshqa email</button>
      </div>

      <div class="conf-card panel" id="confCard">
        <!-- filled by JS -->
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <script src="data.js"></script>
