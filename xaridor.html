<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TIJORAT MARKAZI — xaridor kabineti: B2B katalog, narx so'rovlari, takliflarni taqqoslash va buyurtmalarni kuzatish." />
  <title>Xaridor kabineti — TIJORAT MARKAZI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="markets.css" />
  <link rel="stylesheet" href="legal.css" />
</head>
<body class="mk" data-market="bozor">

  <!-- ===== LOGIN ===== -->
  <section class="admin-login" id="xrLoginView">
    <form class="an-login-card" id="xrForm">
      <span class="eyebrow" data-i18n="xr_brand">Xaridor</span>
      <h1 data-i18n="xr_login_h">Xaridor kabineti</h1>
      <p class="co-sub" data-i18n="xr_login_sub">Login va parol bilan kiring. Hisob ariza tasdiqlangandan keyin ochiladi.</p>
      <input id="xrLogin" placeholder="Login" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      <input id="xrPass" type="password" placeholder="••••••••" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit" id="xrBtn" data-i18n="xr_login_btn">Kirish →</button>
      <p class="an-err" id="xrErr"></p>
      <a class="an-back" href="xaridor-royxat.html" data-i18n="xr_no_account">Hisobingiz yo'qmi? Ariza topshiring</a>
      <a class="an-back" href="index.html" data-i18n="xr_back_site">← Saytga qaytish</a>
    </form>
  </section>

  <!-- ===== SHELL ===== -->
  <div class="admin-shell" id="xrShell" hidden>
    <aside class="admin-side">
      <div class="admin-brand">
        <div><b>TIJORAT MARKAZI</b><span id="xrBrandSub">Xaridor</span></div>
      </div>
      <nav class="admin-nav" id="xrNav"></nav>
      <a class="admin-back" href="index.html" data-i18n="xr_back_site">← Saytga qaytish</a>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1 id="xrViewTitle">Katalog</h1>
        <span class="mk-badge" id="xrChannel" style="margin-left:auto">B2B</span>
        <button class="icon-btn" id="themeBtn" type="button" title="Tema"></button>
        <button class="lang-btn" id="langBtn" type="button">UZ</button>
        <button class="btn btn-ghost" id="xrLogout" type="button" data-i18n="xr_logout">Chiqish</button>
      </div>

      <section class="admin-view" id="view-catalog"></section>
      <section class="admin-view" id="view-rfq"></section>
      <section class="admin-view" id="view-orders"></section>
      <section class="admin-view" id="view-threads"></section>
      <section class="admin-view" id="view-legal"></section>
      <section class="admin-view" id="view-profile"></section>
    </main>
  </div>

  <!-- Asking a seller and comparing offers both happen in MK.drawer(), which
       builds its own markup on first use — see market-kit.js. -->

  <script src="data.js"></script>
  <script src="ui-dialog.js"></script>
  <script src="markets-i18n.js"></script>
  <script src="market-kit.js"></script>
  <script src="auth.js"></script>
  <script src="legal-text-oferta.js"></script>
  <script src="legal-text-maxfiylik.js"></script>
  <script src="legal-render.js"></script>
  <script src="legal-gate.js"></script>
  <script src="legal-settings.js"></script>
  <script src="xaridor.js"></script>
  <script src="cabinet-nav.js"></script>
  <script src="monument-bg.js"></script>
  <script src="skyline.js"></script>
  <script src="background.js"></script>
</body>
</html>
