worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format path_only '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout path_only;
    server_tokens off;
    # Only the existing edge proxy can reach this unpublished Docker listener.
    # Its site replaces X-Real-IP after checking Cloudflare's peer ranges.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $tm_connection { default upgrade; '' close; }
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Pages revalidate after every release; the build versions their CSS and JS URLs.
        add_header Cache-Control no-cache always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        # Unique DNS alias avoids AgroZanjir's backend/frontend service aliases.
        # A variable defers resolution, so frontend can start before backend.
        location ~ ^/(api|ws|uploads)(/|$) {
            set $tm_backend tijoratmarkazi-backend-upstream:4321;
            proxy_pass http://$tm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $tm_connection;
            client_max_body_size 50m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            # Nginx error logs cannot redact query tokens. Access logs retain
            # path/status/latency without query strings; backend has diagnostics.
            error_log /dev/null;
        }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
