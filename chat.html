<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guruh chat — TIJORAT MARKAZI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chat-page">
  <div id="chatRoot"></div>

  <script src="data.js"></script>
  <script src="ui-dialog.js"></script>
  <script src="chat-kit.js"></script>
  <script src="group-chat.js"></script>
  <script>
  /* The chat page carries no login of its own: it reads whichever panel
     session is already open and sends those same credentials on. No
     session means nothing to show, so it hands over to the login page. */
  (function(){
    var theme = localStorage.getItem("kg_theme") || "light";
    document.documentElement.dataset.theme = theme;
    var lang = localStorage.getItem("kg_lang") || "uz";
    document.documentElement.lang = lang;

    function stored(key){
      try { return JSON.parse(sessionStorage.getItem(key) || "null"); } catch(e){ return null; }
    }
    // Most privileged first — rais and admin share the admin panel.
    var creds = null, back = "index.html";
    if(sessionStorage.getItem("kg_admin") === "1"){ creds = { pass:"admin" }; back = "admin.html"; }
    var rais = stored("kg_rais"); if(!creds && rais && rais.login){ creds = rais; back = "admin.html"; }
    var as   = stored("kg_as");   if(!creds && as   && as.login){   creds = as;   back = "association.html"; }
    var co   = stored("kg_co");   if(!creds && co   && co.login){   creds = co;   back = "company.html"; }

    /* An analyst reads aggregates and is deliberately not a participant in the
       members' chat, where commercially sensitive trade talk happens. Send
       them back to their own panel instead of to the sign-in page. */
    var an = stored("kg_an");
    if(!creds && an && an.login){ location.replace("tahlil.html"); return; }

    if(!creds){ location.replace("assistant.html"); return; }
    kgGroupChat({ mount: document.getElementById("chatRoot"), creds: creds, lang: lang, backHref: back });
  })();
  </script>
  <script src="monument-bg.js"></script>
  <script src="skyline.js"></script>
  <script src="background.js"></script>
</body>
</html>
