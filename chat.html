<!DOCTYPE html>
<html lang="uz">
<head>
  <script src="auth.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guruh chat — TIJORAT MARKAZI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chat-page">
  <div id="chatRoot"></div>

  <script src="data.js"></script>
  <script src="ui-dialog.js"></script>
  <script src="chat-kit.js"></script>
  <script src="group-chat.js"></script>
  <script>
  /* The chat page carries no login of its own: it reads whichever panel
     session is already open and sends those same credentials on. No
     session means nothing to show, so it hands over to the login page. */
  (function(){
    var theme = localStorage.getItem("kg_theme") || "light";
    document.documentElement.dataset.theme = theme;
    var lang = localStorage.getItem("kg_lang") || "uz";
    document.documentElement.lang = lang;

    KGAuth.ready().then(function(s){
      if(!s.authenticated||s.restricted){kgRequireLogin("chat.html");return;}
      if(!["admin","rais","assoc","company"].includes(s.role)){location.replace(KGAuth.safeTarget(s.target)||"index.html");return;}
      kgGroupChat({mount:document.getElementById("chatRoot"),lang:lang,backHref:KGAuth.safeTarget(s.target)||"index.html"});
    }).catch(function(e){document.getElementById("chatRoot").textContent=e.message;});
  })();
  </script>
  <script src="monument-bg.js"></script>
  <script src="skyline.js"></script>
  <script src="background.js"></script>
</body>
</html>
